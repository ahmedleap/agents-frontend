<section class="signup-page">
  <div class="signup-card">
    <header>
      <h2>Create your account</h2>
      <p>Set up your trading profile to get started.</p>
    </header>

    @if (submitted()) {
      <p class="alert" role="alert">We could not create your account. Check your details and try again.</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="two-up">
        <label>First name<input formControlName="firstName" autocomplete="given-name"></label>
        <label>Last name<input formControlName="lastName" autocomplete="family-name"></label>
      </div>
      <label>Email<input type="email" formControlName="email" autocomplete="email"></label>
      <label>Date of birth<input type="date" formControlName="dateOfBirth"></label>
      <label>SSN<input inputmode="numeric" formControlName="ssn" maxlength="9" autocomplete="off"></label>
      <label>Password<input type="password" formControlName="password" autocomplete="new-password"></label>
      <button type="submit">Create account</button>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</section>
