<section class="login-page">
  <div class="login-card">
    <header>
      <h2>Log in</h2>
      <p>Enter your email and password to continue.</p>
    </header>

    @if (form.hasError('badCredentials')) {
      <p class="alert" role="alert">Wrong email or password. Try again.</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label>Email<input type="email" formControlName="email" autocomplete="email"></label>
      <label>Password<input type="password" formControlName="password" autocomplete="current-password"></label>
      <button type="submit">Log in</button>
    </form>

    <p class="switch">Don't have an account? <a routerLink="/signup">Sign up</a></p>
  </div>
</section>
