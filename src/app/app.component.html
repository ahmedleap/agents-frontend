<!-- App Root Template -->
<div class="app-container">
  @if (appInitialized()) {
    <header class="app-header">
      <h1>{{ title() }}</h1>
    </header>
    
    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  } @else {
    <div class="loading-state">
      <p>Initializing application...</p>
    </div>
  }
</div>
