<div class="app-container">
  @if (appInitialized()) {
    <header class="app-header">
      <svg class="logo" viewBox="0 0 256 256" aria-hidden="true" focusable="false">
        <g fill="#fff" stroke="#245a20" stroke-width="5" stroke-linejoin="round">
          <g transform="translate(86 100) rotate(-32)"><rect x="-28" y="-22" width="56" height="44"/><circle r="8" fill="none" stroke-width="3.5"/></g>
          <g transform="translate(170 100) rotate(32)"><rect x="-28" y="-22" width="56" height="44"/><circle r="8" fill="none" stroke-width="3.5"/></g>
          <g transform="translate(94 102) rotate(-18)"><rect x="-28" y="-22" width="56" height="44"/><circle r="8" fill="none" stroke-width="3.5"/></g>
          <g transform="translate(162 102) rotate(18)"><rect x="-28" y="-22" width="56" height="44"/><circle r="8" fill="none" stroke-width="3.5"/></g>
          <g transform="translate(128 98)"><rect x="-28" y="-22" width="56" height="44"/><circle r="8" fill="none" stroke-width="3.5"/></g>
        </g>
        <path d="M70 120 C34 142 38 218 128 218 C218 218 222 142 186 120 Z" fill="#2f6f2a"/>
        <rect x="60" y="112" width="136" height="14" rx="3" fill="#245a20"/>
        <g transform="translate(128 173) scale(3.3)" stroke="#fff" stroke-width="2.6">
          <path d="M0 -9.5 V9.5" fill="none" stroke-linecap="round"/>
          <path d="M4.5 -4 C4.5 -8 -4.5 -8 -4.5 -3.5 C-4.5 1 4.5 -1 4.5 3.5 C4.5 8 -4.5 8 -4.5 4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </svg>
      <h1>{{ title() }}</h1>
      <p>{{ subtitle() }}</p>
    </header>

    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  } @else {
    <div class="loading-state">
      <p>Initializing application...</p>
    </div>
  }
</div>
